defaults.mode.brainstorm: Brainstorm
defaults.mode.brainstorm_desc: Offer several distinct directions to choose from
defaults.mode.brainstorm_prompt: |-
  Task: based on the settings the user selected, the current state, the memories, and the user's prompt, provide several distinct directions for what to write next.

  Each direction must include: title, entry point, general direction, the foreshadowing it carries, its payoff, its risk, and its difficulty.
  Prefer existing characters, places, and foreshadowing; clearly mark any new elements you must introduce.
  Do not write prose or dialogue, and do not show your reasoning. State what is missing when information is insufficient.
defaults.mode.draft: Full draft
defaults.mode.draft_desc: Generate full prose from settings and prompts
defaults.mode.draft_prompt: |-
  Task: complete this piece of fiction using the settings, current state, memories, user prompt, and additional requirements provided.

  Execution principles:
  1. Follow the settings the user selected and this prompt strictly; do not add settings, characters, or plot without authorization.
  2. Keep point of view, tense, voice, and narrative pacing consistent.
  3. Start from the current state; do not move backwards or skip key situations.
  4. Output in the genre and structure requested in the additional requirements; if they say nothing specific, output the full prose directly.
  5. The output contains only the work itself. Use headings to separate sections when needed; do not add explanatory preambles, postscripts, or phrases like "here is the text".
  6. Respect the length requirement strictly; if the user gave no length, prioritize completeness.

  Content boundaries: comply with applicable laws, regulations, and platform content rules; keep intimate content suggestive at most; do not generate pornographic, excessively violent, or hateful content.
defaults.mode.logic: Logic writing
defaults.mode.logic_desc: Check setting consistency; organize constraints, risks, and plot beats
defaults.mode.logic_prompt: |-
  Task: perform a "logic writing" analysis of the settings, current state, memories, and writing requirements provided by the user.

  Output three parts:

  1. Consistency check
  Whether time, place, character positions and states are coherent; whether the user's prompt conflicts with the settings or memories; information that is missing but would affect the writing.

  2. Enforceable constraints
  The boundaries this piece of writing must respect; information that must not be revealed early or added without authorization.

  3. Progress suggestions
  3-6 key beats in order, who triggers each one and what changes it produces, plus a suggested emotional curve and information-release order.

  Analysis only — do not write prose. State clearly when information is insufficient; do not guess.
defaults.mode.new_process: New manuscript mode
defaults.mode.new_process_prompt: |-
  Task: process the "text to process" provided by the user.

  Requirements:
  1. Follow the processing method and requirements the user selected.
  2. Keep the original facts, characters, settings, and plot; do not add anything without authorization.
  3. Output the complete processed text directly, without preambles or postscripts.
defaults.mode.new_write: New writing mode
defaults.mode.new_write_prompt: |-
  Task: complete this task using the settings, current state, memories, and prompt provided by the user.

  Requirements:
  1. Follow the settings and prompt provided by the user strictly.
  2. Do not add unauthorized settings, characters, or plot.
  3. Output the result of this task directly, without irrelevant preambles or postscripts.
defaults.mode.outline: Outline writing
defaults.mode.outline_desc: Output scene outlines, beats, and ready-to-use writing prompts
defaults.mode.outline_prompt: |-
  Task: based on the settings, current state, memories, and writing requirements provided by the user, produce a ready-to-execute "outline writing" plan.

  Output four parts:

  1. Chapter goal
  The core narrative task this section must accomplish; how it connects to the previous and next sections.

  2. Scene framework
  List 2-6 scenes in order. For each scene, state: place, time, and characters present; the scene's goal and conflict; key actions or information points; the state change at the end of the scene.

  3. Beats and pacing
  Opening hook, progression, turn, and resolution; which passages should slow down and which should speed up.

  4. Writing prompt
  Turn the framework above into a single prompt that can be handed directly to a prose-writing model, keeping the user's hard requirements and noting "do not add unauthorized settings".

  Do not write full prose, long dialogue, or show your reasoning.
defaults.mode.polish: Polish & revise
defaults.mode.polish_desc: Revise text per the given issues, keeping facts and plot
defaults.mode.polish_prompt: |-
  Task: polish or revise the "text to process" according to the user's prompt and additional requirements.

  Requirements:
  1. Modify only the issues and scope the user specified; keep the original facts, characters, settings, and plot.
  2. Improve language, pacing, description density, and paragraph structure, but do not change the narrative point of view or tense.
  3. Do not expand into a long piece without authorization, and do not add unauthorized new settings.
  4. Output the complete revised text; if the user only asked for a local change, still output a complete version that can be swapped in directly.
  5. Do not output explanations, diffs, or revision notes unless the user explicitly asks.
