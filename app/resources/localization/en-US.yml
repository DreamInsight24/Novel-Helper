defaults.mode.brainstorm: Brainstorm
defaults.mode.brainstorm_desc: Offer several distinct directions to choose from
defaults.mode.brainstorm_prompt: |-
  Task: offer several distinct directions for what happens next, so the user can pick one.

  Goal: let the user compare the options in one place and decide what comes next right away.

  Each direction must include: title, entry point, general direction, the foreshadowing it carries, its payoff, its risk, and its difficulty.
  Prefer existing characters, places, and foreshadowing; clearly mark any new element you must introduce.
  Do not write prose or dialogue and do not show your reasoning; state what is missing when information is insufficient.
defaults.mode.draft: Full draft
defaults.mode.draft_desc: Generate full prose from settings and prompts
defaults.mode.draft_prompt: |-
  Task: write fiction prose that can be used as-is, using the given settings and the requirements for this run.

  Goal: this section should be publishable without further patching or trimming.

  How to work:
  1. Use the given settings and this prompt strictly; never add unauthorized characters, settings, or plot.
  2. Keep point of view, tense, voice, and narrative pacing consistent with the earlier text.
  3. Move forward from the current state; do not move backwards or skip key situations.
  4. Output in the genre and structure the additional requirements ask for; without further instructions, output the full prose directly.
  5. Respect the length requirement strictly; when no length is given, prioritize completeness.

  Output: the prose only. Use headings to separate sections when needed; no explanatory preamble, postscript, or phrases like "here is the text".

  Content boundaries: keep intimate content suggestive at most; do not produce pornographic, excessively violent, or hateful content.
defaults.mode.logic: Logic writing
defaults.mode.logic_desc: Check setting consistency; organize constraints, risks, and plot beats
defaults.mode.logic_prompt: |-
  Task: run a "logic writing" analysis for this piece so it is clear what may be written, what must not be, and what order to write it in.

  Goal: keep the prose that follows consistent with the settings and on track with the key turning points.

  How to work:
  1. Check the given settings and current state one by one: are time, place, character positions and states coherent, and do they conflict with each other?
  2. Find information the user's prompt omits that would directly affect the prose, and list the gaps explicitly.
  3. Give an executable order of progression, not generic advice.

  Output:
  1. Consistency check (coherent / conflicting / missing)
  2. Enforceable constraints (the boundaries this run must respect, plus anything that must not be revealed early or invented)
  3. Progress suggestions (3-6 beats in order: who triggers it, what changes, the emotional curve and information-release order)

  Analysis only — no prose and no visible reasoning; state plainly what is missing when information is insufficient.
defaults.mode.new_process: New manuscript mode
defaults.mode.new_process_prompt: |-
  Task: process the "text to process" in the way the user asked for.

  Requirements:
  1. Follow the processing method and requirements the user selected.
  2. Keep the original facts, characters, settings, and plot; do not add anything without authorization.
  3. Output the complete processed text directly, without preambles or postscripts.
defaults.mode.new_write: New writing mode
defaults.mode.new_write_prompt: |-
  Task: complete the writing job the user is asking for.

  Requirements:
  1. Use the given settings and the user's prompt; do not add unauthorized characters, settings, or plot.
  2. Output the result of this job directly, without irrelevant preambles or postscripts.
  3. Where something is genuinely unclear, take the most reasonable reading and flag it at the end with a single line starting "To confirm: ".
defaults.mode.outline: Outline writing
defaults.mode.outline_desc: Output scene outlines, beats, and ready-to-use writing prompts
defaults.mode.outline_prompt: |-
  Task: produce an "outline writing" plan that can be handed straight to prose writing.

  Goal: writing the prose should only require following the plan, not designing the structure again.

  Output:
  1. Section goal: the core narrative task of this section and how it connects to what comes before and after.
  2. Scene framework: 2-6 scenes in order, each stating place, time, characters present, goal and conflict, key action or information, and the state change at the end.
  3. Beats and pacing: opening hook, progression, turn, resolution; which passages slow down and which speed up.
  4. Writing prompt: turn the above into one ready-to-execute prompt, keeping the user's hard requirements and noting that unauthorized settings must not be added.

  New characters, places, and rules may only come from the given settings; when they are genuinely absent, list them under "Needs filling in: ".
  Do not write full prose or long dialogue, and do not show your reasoning.
defaults.mode.polish: Polish & revise
defaults.mode.polish_desc: Revise text per the given issues, keeping facts and plot
defaults.mode.polish_prompt: |-
  Task: revise the "text to process" according to the user's prompt and additional requirements.

  Goal: the result can replace the original text directly.

  How to work:
  1. Change only the issues and scope the user named; keep the original facts, characters, settings, and plot.
  2. Improve language, pacing, description density, and paragraph structure, but keep the narrative point of view and tense.
  3. Do not expand into a long piece without authorization, and do not add unauthorized new settings.
  4. When the user only asks for a local change, still output a complete version that can be swapped in directly.
  5. Do not output explanations, diffs, or revision notes unless the user explicitly asks.
