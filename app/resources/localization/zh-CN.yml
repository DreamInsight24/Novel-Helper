manuscript.sample_1_content: "城门将闭，林舟赶在最后一声钟响前走进雨幕。\n\n他握紧怀中的信，抬眼望向街角那盏仍亮着的灯。守门人没有盘问他的来路，只在看见信封上的红印时，悄悄退了半步。\n\n“今晚别走河边。”那人说。\n\n林舟回头时，城门已经合上了。"
manuscript.sample_2_title: "林舟 · 人物动机.md"
manuscript.sample_2_content: "## 表层目标\n找到失踪的故人，交出三年前未能送达的信。\n\n## 内在矛盾\n他相信自己只是一个送信人，却始终不敢承认：故人的失踪与他当年的沉默有关。\n\n## 场景线索\n信封上的红印、故人惯用的三下敲门声、河边旧客栈的登记簿。"
manuscript.sample_3_title: "河边客栈 · 场景补写.txt"
manuscript.sample_3_content: "门轴轻响，客栈里的人同时抬起了头。\n\n掌柜擦拭着一只早已干净的杯子，目光越过林舟的肩膀，看向空无一人的雨巷。楼上传来三下敲击声，间隔很慢，像是有人在等待回应。\n\n林舟把信放在柜台上。\n\n“我要找一个人。”\n\n掌柜停下手里的动作：“这里的人，都这么说。”"

