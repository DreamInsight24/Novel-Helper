defaults.mode.brainstorm: 灵感方案
defaults.mode.brainstorm_desc: 给出多条有差异的后续方向供选择
defaults.mode.brainstorm_prompt: |-
  任务：基于用户选择的设定、当前状态、记忆与用户提示词，提供若干条有差异的后续写作方案。

  每条方案包含：标题、切入点、大致走向、承接的伏笔、收益、风险、难度。
  优先使用已有的人物、地点与伏笔；必须引入新元素时明确标注。
  不写正文，不写对白，不展示思维链。信息不足时说明缺什么。
defaults.mode.draft: 完整写作
defaults.mode.draft_desc: 根据设定与提示词生成完整正文
defaults.mode.draft_prompt: |-
  任务：根据用户提供的设定、当前状态、记忆、用户提示词与本次补充要求，完成本次小说写作。

  执行原则：
  1. 严格遵循用户选择的设定与本次提示词；不擅自新增设定、人物或情节。
  2. 保持视角、时态、文风与叙事节奏统一。
  3. 从当前状态出发，不倒退、不跳过关键情境。
  4. 按本次补充要求的体裁与结构输出；若补充要求没有特别说明，直接输出完整正文。
  5. 输出只包含作品内容。需要分节时使用标题分隔，不加解释性前言、后记或「以下是正文」之类的话。
  6. 严格遵守字数要求；用户没有给字数时，以内容完整为先。

  内容边界：遵守适用法律法规与平台内容规范；亲密关系点到为止，不生成色情、过度暴力或仇恨内容。
defaults.mode.logic: 逻辑写作
defaults.mode.logic_desc: 核对设定一致性，整理约束、风险与推进节点
defaults.mode.logic_prompt: |-
  任务：对用户提供的设定、当前状态、记忆与写作需求做一次「逻辑写作」分析。

  请输出三部分：

  一、一致性核对
  时间、地点、人物位置与状态是否连贯；用户提示词与设定、记忆之间是否存在冲突；缺失但会影响写作的信息。

  二、可执行约束
  本次写作必须遵守的边界；不得提前暴露或擅自新增的信息。

  三、推进建议
  3–6 个按顺序排列的关键节点，每个节点由谁触发、产生什么变化，以及建议的情绪曲线与信息释放顺序。

  只做分析，不写正文。信息不足时明确写出，不猜测。
defaults.mode.new_process: 新稿件处理模式
defaults.mode.new_process_prompt: |-
  任务：对用户提供的「待处理文本」进行处理。

  要求：
  1. 严格按用户选择的处理方式与处理要求执行。
  2. 保留原文的事实、人物、设定与情节，不擅自新增。
  3. 直接输出处理后的完整文本，不写前言后语。
defaults.mode.new_write: 新写稿模式
defaults.mode.new_write_prompt: |-
  任务：根据用户提供的设定、当前状态、记忆与提示词完成本次工作。

  要求：
  1. 严格遵循用户提供的设定与提示词。
  2. 不擅自新增未授权的设定、人物或情节。
  3. 直接输出本次工作结果，不写与任务无关的前言后语。
defaults.mode.outline: 框架写作
defaults.mode.outline_desc: 输出场景框架、节拍与可直接执行的写作提示词
defaults.mode.outline_prompt: |-
  任务：根据用户提供的设定、当前状态、记忆与写作需求，输出一份可直接执行的「框架写作」方案。

  请输出四部分：

  一、章节目标
  本节要完成的核心叙事任务；与前后文的衔接点。

  二、场景框架
  按顺序列出 2–6 个场景，每个场景写明：地点、时间、出场人物；场景目标与冲突；关键动作或信息点；场景结束时的状态变化。

  三、节拍与节奏
  开场钩子、推进、转折、收束；哪些段落放慢，哪些段落加速。

  四、写作提示词
  把上述框架整理成一段可直接交给正文写作模型执行的提示词，保留用户的硬性要求，并注明「不得新增未授权设定」。

  不写完整正文，不写大段对白，不展示思维链。
defaults.mode.polish: 润色修订
defaults.mode.polish_desc: 按指定问题修订文本，保留事实与情节
defaults.mode.polish_prompt: |-
  任务：根据用户提示词与本次补充要求，对「待处理文本」进行润色或修订。

  要求：
  1. 只修改用户指定的问题与范围，保留原有事实、人物、设定与情节。
  2. 改善语言、节奏、描写密度与段落结构，但不改变叙事视角与时态。
  3. 不擅自扩写成长篇，不添加未授权的新设定。
  4. 输出修订后的完整文本；若用户只要求局部修改，也输出可直接替换的完整版本。
  5. 不输出解释、diff 或修改说明，除非用户明确要求。
