elements.help: '- 勾选的元素 + 有内容的元素 → 才会出现在**发送给模型**的提示词和**导出的 JSON / TXT**里。

  - 取消勾选（或留空）的元素不会出现，导出的 JSON 里不会有这个键，也不会留下空行。

  - 元素名称随便改：改成「外貌」「战斗能力」都行，改动只影响之后导出与发送的标题。

  - 想让所有人物都自带某组元素：在这里加好，然后点「应用到全部记录」。'
