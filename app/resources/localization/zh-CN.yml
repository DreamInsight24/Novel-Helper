sections.help: '- 每个栏目就是一个普通设定集合：和「其他设定」一样可以放条目、写元素树、导出 JSON / TXT。

  - 想给栏目配一套默认元素模板：到「元素模板」页，在下拉框里选中这个栏目即可。

  - 「按分类一键归类」会把「其他设定」里分类名匹配的条目搬进对应栏目，原文与来源都保留。

  - 删除栏目只删入口，不动文件；想彻底清掉可以自己删 data/section_<key>.json。'
