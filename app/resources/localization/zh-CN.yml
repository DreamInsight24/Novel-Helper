records.help_title: "设定填写帮助"
records.edit_guidance: "先写名称、概述与正文，再按需补充信息分组。\n“关联”支持任意条目之间的单向或双向关系，可搜索其他栏目并自定义关系名称与备注。关系只保存一份，两端均可查看；原有势力成员已兼容。\n关联图以当前条目为中心，点击＋展开间接关联，共享条目只出现一次，真实连线可以形成环。\n旧模板字段及手写关系保留，不会按同名自动连线。字段结构、备注、分类与删除位于“更多”。"
