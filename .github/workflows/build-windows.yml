name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "app/**"
      - "NovelHelper.spec"
      - "requirements-build.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt -r requirements-build.txt

      - name: Run self-test
        run: python app/selftest.py

      - name: Build EXE
        run: pyinstaller --clean --noconfirm NovelHelper.spec

      - name: Smoke-test EXE
        shell: pwsh
        run: |
          & ".\dist\NovelHelper.exe" --check
          if ($LASTEXITCODE -ne 0) {
            throw "NovelHelper.exe --check failed with exit code $LASTEXITCODE"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovelHelper-windows-x64
          path: dist/NovelHelper.exe
          if-no-files-found: error

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NovelHelper.exe
          generate_release_notes: true
